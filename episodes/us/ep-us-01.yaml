    - {kind: approval_requested, approval_kind: send_external_message, min_count: 1}
    - {kind: txn_status, btx_ids: [btx-cedarline-001, btx-cedarline-002, btx-cedarline-003], classification_status: proposed}
    - {kind: workpaper_state, workpaper_kind: classification_summary, status: final, must_tie: null}
    - {kind: task_state, task_id: tsk-cedarline-may-close, status: ready_for_review}
